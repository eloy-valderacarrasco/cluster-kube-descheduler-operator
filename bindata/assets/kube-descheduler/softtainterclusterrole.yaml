apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openshift-descheduler-softtainter
rules:
- apiGroups:
  - "events.k8s.io"
  resources:
  - "events"
  verbs:
  - "get"
  - "watch"
  - "list"
  - "create"
  - "update"
  - "patch"
  - "delete"
- apiGroups:
  - ""
  resources:
  - "nodes"
  verbs:
  - "get"
  - "watch"
  - "list"
  - "patch"
  - "update"
# The compactor inspects the pods assigned to a node to decide whether the node
# can be sealed safely: pods with local storage cannot live-migrate and must not
# be stranded. Read-only; the compactor never evicts pods.
- apiGroups:
  - ""
  resources:
  - "pods"
  verbs:
  - "get"
  - "watch"
  - "list"
- apiGroups:
  - "operator.openshift.io"
  resources:
  - "kubedeschedulers"
  verbs:
  - "get"
  - "watch"
  - "list"
